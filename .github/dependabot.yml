version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "의존성"
    commit-message:
      prefix: "chore"
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "의존성"
    commit-message:
      prefix: "chore"
    groups:
      dependencies:
        patterns:
          - "*"
