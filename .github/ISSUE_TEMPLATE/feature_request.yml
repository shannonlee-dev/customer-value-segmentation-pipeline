name: 기능 제안
description: 해결할 문제와 원하는 동작을 설명해 주세요.
title: "[제안] "
labels: [기능 제안]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 어떤 상황에서 불편하거나 부족한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작
      description: 변경 후 사용 흐름이나 결과를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안과 참고 자료
      description: 검토한 다른 방법이나 관련 예시가 있으면 적어 주세요.
